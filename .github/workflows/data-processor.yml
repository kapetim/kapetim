name: data-processor

# Manual, cross-repo. Runs scripts/data-processor.sh inside
# docker/data-processor.Dockerfile from the target repo.
# Needs a RELEASE_TOKEN PAT (repo scope).

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (owner/name, e.g. kapetim/data-science)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: data-processor-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  data-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          token: ${{ secrets.RELEASE_TOKEN }}
          submodules: recursive
          lfs: true
      - name: Build image
        run: docker build -f docker/data-processor.Dockerfile -t repo-data-processor .
      - name: Run scripts/data-processor.sh
        run: docker run --rm -v "$PWD:/repo" -w /repo repo-data-processor bash scripts/data-processor.sh
